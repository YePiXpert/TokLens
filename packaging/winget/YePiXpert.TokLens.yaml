ShortDescription: Local AI coding usage, service-tier evidence and API reference cost monitor.
Description: |-
  TokLens reads local AI coding logs and displays token usage, service-tier evidence and estimated API-equivalent costs.
  Windows provides a native WPF desktop and optional floating status control. A Python probe supports Linux and macOS.
  Gist and WebDAV can synchronize collected history. Coverage depends on available logs; missing historical data cannot be reconstructed.
  Estimates do not represent actual subscription charges or remaining account quota.
