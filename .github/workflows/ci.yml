name: Build, Verify & Release TokLens
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify canonical version and embedded pricing
        shell: pwsh
        run: |
          ./packaging/sync_version.ps1 -Check
          $version = (Get-Content version.txt -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match version.txt.' }
      - name: Python accounting and shared fixtures
        shell: pwsh
        run: |
          python -m py_compile vps/toklens_agent.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax failed.' }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed.' }
      - name: C# accounting, UI and shared fixtures
        shell: pwsh
        run: ./tests/run_tests.ps1
      - name: Build desktop executable
        shell: cmd
        run: call build.bat --nopause
      - name: Generate and verify release assets and manifests
        shell: pwsh
        run: |
          ./packaging/package_release.ps1 -SkipBuild
          ./packaging/package_release.ps1 -VerifyOnly
      - uses: actions/upload-artifact@v4
        with:
          name: TokLens-Portable-Windows
          retention-days: 30
          if-no-files-found: error
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TokLens-Portable-Windows
          path: release-assets
      - name: Verify transported checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/TokLens-v*-win-x64-portable.zip
            release-assets/TokLens.exe
            release-assets/toklens_agent.py
            release-assets/install_macos_launchd.sh
            release-assets/service_tier_prices.json
            release-assets/SHA256SUMS.txt
            release-assets/manifests/*
